<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#fdf6ee">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>DrawIt</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header id="top">
    <button class="ib" id="btnMenu" title="Menü">☰</button>
    <button id="docName" class="name" title="Umbenennen">Meine Karte</button>
    <span class="sp"></span>
    <button class="ib" id="btnUndo" title="Rückgängig">↶</button>
    <button class="ib" id="btnRedo" title="Wiederholen">↷</button>
    <button class="tb" id="btnLayers">▦ Ebenen</button>
    <button class="tb primary" id="btnExport">⬆ Export</button>
  </header>
  <div id="optbar"></div>
  <div id="main">
    <nav id="tools"></nav>
    <div id="stage">
      <canvas id="view"></canvas>
      <div id="zoombar">
        <button class="ib" id="zOut">−</button>
        <button class="tb" id="zFit">100%</button>
        <button class="ib" id="zIn">+</button>
      </div>
    </div>
    <aside id="layersPanel" class="hidden"></aside>
  </div>
  <footer id="colors"></footer>
</div>
<div id="modal"></div>
<div id="toast"></div>
<div id="printArea"></div>
<input type="file" id="fileIn" accept="image/*" hidden>
<script src="app.js"></script>
</body>
</html>
